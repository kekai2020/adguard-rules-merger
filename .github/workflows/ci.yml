name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff check
        run: uv run ruff check merger merge_rules.py config_loader.py tests
      - name: Ruff format check
        run: uv run ruff format --check merger merge_rules.py config_loader.py tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Validate config
        run: uv run python -m merger validate config/sources.yaml
      - name: Unit tests
        run: uv run pytest tests/ -q --tb=short

  build:
    name: Build wheel & sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Build
        run: uv run python -m build
      - name: Verify console script installs
        run: |
          uv venv /tmp/verify-venv
          uv pip install --python /tmp/verify-venv/bin/python dist/*.whl
          /tmp/verify-venv/bin/adguard-rules-merger version
      # Guards against wheel content regressions (e.g. a sub-package missing
      # from [tool.setuptools] packages): ``version`` does not import the full
      # engine, so run one offline local-file merge from the installed wheel.
      - name: Smoke merge from installed wheel
        run: |
          printf '||example.com^\n||ads.example.org^\n||tracker.example.net^\n' > /tmp/smoke-rules.txt
          printf 'sources:\n  - name: local-smoke\n    url: /tmp/smoke-rules.txt\n    category: other\n    enabled: true\n' > /tmp/smoke-sources.yaml
          /tmp/verify-venv/bin/adguard-rules-merger merge --config /tmp/smoke-sources.yaml \
            --no-audit --output /tmp/smoke-out --cache-dir /tmp/smoke-cache
          grep -q '||example.com^' /tmp/smoke-out/merged_rules.txt
          echo "wheel smoke merge OK"
      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          retention-days: 14
          compression-level: 6
