name: DNS Reachability Audit

# Daily sampled audit (after the merge workflow window). Informational only:
# never fails the pipeline; artifacts + committed dns_audit.* are the outputs.
# The report.md/html stay merge-generated — the audit does NOT inject into
# them in CI, so byte-determinism of committed reports is preserved.

# NOTE: the daily SAMPLED audit runs inside merge.yml (before commit), so the
# published report.md/html always carry the latest DNS section. This workflow
# is for STANDALONE/manual runs only (e.g. a full 2.77M sweep via dispatch
# input, which exceeds the merge job budget).
on:
  workflow_dispatch:
    inputs:
      blocks_sample:
        description: "block-rule domains to audit (0 = allow-side only; 2770000 = full sweep)"
        default: "20000"
      min_live:
        description: "minimum live resolvers required"
        default: "2"
      shard_count:
        description: "parallel matrix jobs (full sweep: 4 fits well inside the 6h job limit)"
        default: "1"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Skip unused shards
        if: ${{ matrix.shard_index >= (github.event.inputs.shard_count || '1') }}
        run: echo "shard not needed" && exit 0
      - name: Mark used
        if: ${{ matrix.shard_index < (github.event.inputs.shard_count || '1') }}
        run: echo "shard ${{ matrix.shard_index }} active"
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Run DNS reachability audit (DoH, self-diagnosed)
        continue-on-error: true # informational: a dead channel must not fail CI
        run: |
          uv run python scripts/dns_coverage_audit.py \
            --out-dir output --cache-dir cache \
            --mode doh --concurrency 200 --timeout 4 \
            --min-live ${{ github.event.inputs.min_live || '2' }} \
            --blocks-sample ${{ github.event.inputs.blocks_sample || '20000' }} \
            --checkpoint-every 200000 \


      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-audit-shard-${{ matrix.shard_index }}
          path: output/dns_audit.shard*of*.json
          if-no-files-found: ignore

  gather:
    needs: audit
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && (github.event.inputs.shard_count || '1') > 1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: dns-audit-shard-*
          path: output/
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Gather shards into final artifacts
        run: uv run python scripts/dns_coverage_audit.py --out-dir output --cache-dir cache --gather
      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-audit
          path: |
            output/dns_audit.json
            output/dns_audit.md
          if-no-files-found: ignore

      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/dns_audit.json output/dns_audit.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "dns-audit: reachability results $(date -u +'%Y-%m-%d')"
            git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}
          fi
