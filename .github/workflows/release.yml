name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v8.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Build wheel and sdist
        run: uv run python -m build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/verify-venv
          uv pip install --python /tmp/verify-venv/bin/python dist/*.whl
          /tmp/verify-venv/bin/adguard-rules-merger version
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" dist/* \
            --title "AdGuard Rules Merger ${{ steps.tag.outputs.name }}" \
            --generate-notes
