[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adguard-rules-merger"
version = "8.0.1"
description = "Download, merge, deduplicate, and publish AdGuard Home filter rules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "kekai2020", email = "kekai@example.com"},
]
keywords = ["adguard", "dns", "filter", "blocklist", "merge", "security", "phishing", "malware"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "tldextract>=5.0",
    "dnspython>=2.4",
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "build>=1.2",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/kekai2020/adguard-rules-merger-v8"
Repository = "https://github.com/kekai2020/adguard-rules-merger-v8"
Issues = "https://github.com/kekai2020/adguard-rules-merger-v8/issues"
Changelog = "https://github.com/kekai2020/adguard-rules-merger-v8/blob/main/CHANGELOG.md"

[project.scripts]
adguard-rules-merger = "merger.cli:app"

[tool.setuptools]
packages = [
    "merger",
    "merger.core",
    "merger.domain_classifier",
    "merger.report",
    "merger.whitelist_audit",
]
py-modules = ["merge_rules", "config_loader"]

[tool.setuptools.package-data]
merger = ["py.typed", "data/*.json"]

# ── pytest ─────────────────────────────────────────────────────────
# Consolidated here in V7 (the standalone pytest.ini was removed).
[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
markers = [
    "slow: marks tests as slow (network/large data; deselect with -m 'not slow')",
]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── ruff (lint + format) ───────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["merger", "tests", "."]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, UP: pyupgrade. This is a deliberately
# conservative, high-signal subset; opinionated rules (B/SIM) are left to
# developer judgement rather than blocking CI.
select = ["E", "F", "I", "UP"]
# Tests keep a few intentional patterns (loose asserts, magic numbers).
ignore = ["E501", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "SIM"]

[tool.ruff.format]
quote-style = "double"

# ── mypy (type gate, non-blocking advisory) ──────────────────────
[tool.mypy]
python_version = "3.10"
packages = ["merger"]
ignore_missing_imports = true
ignore_errors = false
warn_unused_ignores = false
no_warn_no_return = true
follow_imports = "silent"
# Advisory gate (CI is non-blocking), but untyped function bodies ARE checked —
# verified clean as of the architecture batches; keep it honest from here.
check_untyped_defs = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
]
